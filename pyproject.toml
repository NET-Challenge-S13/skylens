[project]
name = "skylens"
version = "0.1.0"
description = "SkyLens - Multi-drone disaster intelligence: 3DGS reconstruction + 4-channel UNet perception"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19,<0.28",
    "transformers>=4.44",
    "timm>=1.0",
    "albumentations>=1.4",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "tifffile>=2024.1.1",
    "tqdm>=4.66",
    "requests>=2.32",
    "huggingface-hub>=0.34",
]

[dependency-groups]
train = [
    "accelerate>=0.34",
    "datasets>=2.20",
    "evaluate>=0.4",
    "tensorboard>=2.17",
]
notebook = [
    "jupyter>=1.1",
    "ipywidgets>=8.1",
    "matplotlib>=3.9",
    "nbformat>=5.10",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    { include-group = "train" },
    { include-group = "notebook" },
]
# 3DGS 복원 (src/skylens_model/models/skylens). 기본 설치에 넣지 않는다 — gsplat 과 fused-ssim 이
# CUDA 툴체인을 요구해서, 복원 작업을 하지 않는 사람이 `uv sync` 에서 막히면 안 된다.
# 설치: `uv sync --group recon` · 자세한 절차는 src/skylens_model/models/skylens/INSTALL.md
#
# 여기 없는 것들은 일부러 뺐다:
#   torch/torchvision/numpy/tqdm/requests  최상위 dependencies 에 이미 있음
#   opencv-python                          최상위 opencv-python-headless 와 cv2 충돌
#   tensorboard                            train 그룹에 이미 있음
recon = [
    "gsplat>=1.5.3",
    "viser>=0.2",
    "nerfview",
    "pycolmap",
    "fused-ssim",
    "imageio[ffmpeg]>=2.34",
    "torchmetrics[image]>=1.4",
    "tyro>=0.8.8",
    "scikit-learn>=1.5",
    "pyyaml>=6.0",
    "pillow>=10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skylens_model"]

[tool.uv]
default-groups = ["dev"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
# recon 그룹의 세 패키지는 PyPI 에 없다. gsplat 예제가 고정한 커밋을 그대로 쓴다.
# ⚠️ 이 pycolmap 은 rmbrualla 포크로, 공식 pycolmap 과 모듈 이름이 같다.
#    둘을 함께 설치하면 서로를 덮어쓴다 (INSTALL.md §2 참고).
pycolmap = { git = "https://github.com/rmbrualla/pycolmap", rev = "cc7ea4b7301720ac29287dbe450952511b32125e" }
nerfview = { git = "https://github.com/nerfstudio-project/nerfview", rev = "4538024fe0d15fd1a0e4d760f3695fc44ca72787" }
fused-ssim = { git = "https://github.com/rahul-goel/fused-ssim", rev = "328dc9836f513d00c4b5bc38fe30478b4435cbb5" }

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["node_modules", "dist", "__pycache__", "data", "res"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["src/skylens_model/tests"]
pythonpath = ["src"]
