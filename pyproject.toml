[project]
name = "skylens"
version = "0.1.0"
description = "SkyLens - multi-drone disaster intelligence: 3DGS reconstruction + 4-channel UNet perception"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=4.44",
    "timm>=1.0",
    "albumentations>=1.4",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "tifffile>=2024.1.1",
    "tqdm>=4.66",
    "requests>=2.32",
]

[project.optional-dependencies]
train = [
    "accelerate>=0.34",
    "datasets>=2.20",
    "evaluate>=0.4",
    "tensorboard>=2.17",
]
notebook = [
    "jupyter>=1.1",
    "ipywidgets>=8.1",
    "matplotlib>=3.9",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# `src/` also holds the TypeScript client/core, so point hatch at the one
# Python package explicitly rather than auto-discovering.
[tool.hatch.build.targets.wheel]
packages = ["src/skylens_model"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["node_modules", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["src/skylens_model/tests"]
pythonpath = ["src"]
