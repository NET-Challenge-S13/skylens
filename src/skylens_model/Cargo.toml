[package]
name = "skylens-model"
description = "Compute server: live reconstruction, meshing and UNet inference"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[[bin]]
name = "skylens-model"
path = "main.rs"

[dependencies]
skylens-shared = { workspace = true, features = ["grpc"] }
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
axum.workspace = true
tonic = { workspace = true, features = ["transport", "router"] }
prost.workspace = true
cumulus3d-cli.workspace = true
deltamesh.workspace = true
pointblitz-io.workspace = true
tch.workspace = true
# datasets / cache: image decode + JPEG/PNG encode (no OpenCV)
# SIGINT/SIGTERM hook for GracefulInterruptCallback
ctrlc = { version = "3", features = ["termination"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
