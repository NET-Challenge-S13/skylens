# 브리지 nginx: KOREN 외부망 진입 (setup-bridge.sh 가 __HTTP_PORT__ · __WEB_DIR__ 치환)
#
# 이 서버(175.126.98.44)에 올라가는 것과 경로:
#   /            → __WEB_DIR__ 정적 파일   현황판 (빌드 산출물, 프록시 없음. 서버 프로세스 없음)
#   /viewer      → 127.0.0.1:20882 → 대전 프록시 :8082 → 코어 /viewer   현황판 WebSocket (protobuf)
#   /uplink      → 127.0.0.1:20882 → 대전 프록시 :8082 → 코어 /uplink   업링크 WebSocket
#   /live/       → 127.0.0.1:20889 → 대전 MediaMTX :10889                라이브 영상 WHEP
#   /healthz     → 127.0.0.1:20889 → 대전 MediaMTX                       터널 생존 확인
#
# skylens_gateway(:8081)는 드론이 직접 붙는 포트라 nginx 를 거치지 않는다.
#
# 대전 쪽 포트는 KOREN 이 SSH(26022) 외 인바운드를 막아 직접 못 붙는다. 이 서버가 대전으로
# SSH 터널 하나(daejeon-tunnel 서비스)를 걸고, 그 안에 두 포워드를 싣는다.
#   -L 127.0.0.1:20889:127.0.0.1:10889   WHEP
#   -L 127.0.0.1:20882:127.0.0.1:8082    프록시 (대전 브리지 키 permitopen 에 8082 포함)
# 현황판 WebSocket 이 프록시를 거치는 것은 코어 주소를 밖에 노출하지 않기 위해서다.

server {
    listen __HTTP_PORT__;
    listen [::]:__HTTP_PORT__;
    server_name _;

    client_max_body_size 1m;

    # ---- 터널 생존 확인 ----
    location = /healthz {
        proxy_pass http://127.0.0.1:20889/;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
        access_log off;
    }

    # ---- 라이브 영상: WHEP (대전 MediaMTX, 터널 경유) ----
    # 브라우저는 /live/<path>/whep 에 POST 한다. 세션 URL(Location)도 /live/ 아래로 되돌린다.
    location /live/ {
        proxy_pass http://127.0.0.1:20889/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect   /                 /live/;
        proxy_read_timeout 60s;
    }

    # ---- 현황판 WebSocket: 뷰어 (대전 프록시 :8082 → 코어 /viewer, 터널 20882 경유) ----
    location = /viewer {
        proxy_pass http://127.0.0.1:20882;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- 업링크 WebSocket (대전 프록시 :8082 → 코어 /uplink, 터널 20882 경유) ----
    location = /uplink {
        proxy_pass http://127.0.0.1:20882;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- 현황판 정적 파일 (빌드 산출물을 __WEB_DIR__ 에 둔다) ----
    location / {
        root __WEB_DIR__;
        index status.html;
        try_files $uri $uri/ =404;
    }
}
