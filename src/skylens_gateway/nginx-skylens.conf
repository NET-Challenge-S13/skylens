# 브리지 nginx — KOREN 외부망 진입 (setup-bridge.sh 가 __HTTP_PORT__ 치환)
#
# 이 서버(175.126.98.44)에 올라가는 것과 경로:
#   /            → skylens_client :8090   현황판 웹 + WebRTC 시그널링 (COMPONENTS §7)
#   /live/       → 대전 MediaMTX :10889   라이브 영상 WHEP (SSH 리버스 터널 → 로컬 20889)
#   /healthz     → 터널 생존 확인
#
# skylens_gateway(:8081)는 드론이 직접 붙는 포트라 nginx 를 거치지 않는다.
#
# 대전 :10889 는 KOREN 이 SSH(26022) 외 인바운드를 막아 직접 못 붙는다. 이 서버가 대전으로
# SSH 터널(-L 127.0.0.1:20889:127.0.0.1:10889)을 걸어두므로(daejeon-tunnel 서비스) 로컬 20889 로 보낸다.
# skylens_client 가 아직 안 떠 있으면 / 는 502 — 정상. /live/ 만 먼저 쓴다.

server {
    listen __HTTP_PORT__;
    listen [::]:__HTTP_PORT__;
    server_name _;

    client_max_body_size 1m;

    # ---- 터널 생존 확인 ----
    location = /healthz {
        proxy_pass http://127.0.0.1:20889/;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
        access_log off;
    }

    # ---- 라이브 영상: WHEP (대전 MediaMTX, 터널 경유) ----
    # 브라우저는 /live/<path>/whep 에 POST 한다. 세션 URL(Location)도 /live/ 아래로 되돌린다.
    location /live/ {
        proxy_pass http://127.0.0.1:20889/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect   /                 /live/;
        proxy_read_timeout 60s;
    }

    # ---- 현황판 웹 + 시그널링 (skylens_client) ----
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
