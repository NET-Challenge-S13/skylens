# The bridge nginx: the way into KOREN from outside.
# setup-bridge.sh and setup-bridge-macos.sh substitute __HTTP_PORT__ and __WEB_DIR__.
#
# What runs on this host (175.126.98.44) and where each path goes:
#   /            -> static files in __WEB_DIR__   the status board (a wasm build)
#   /viewer      -> 127.0.0.1:20882 -> Daejeon proxy :8082 -> core /viewer   board socket
#   /uplink      -> 127.0.0.1:20882 -> Daejeon proxy :8082 -> core /uplink   uplink socket
#   /live/       -> this host's MediaMTX, or the Daejeon one through the tunnel   WHEP
#   /healthz     -> 127.0.0.1:20889                                          is the tunnel alive
#   /health      -> nginx itself                                             is this host alive
#
# This file relays signalling and control. Where the video media comes from is a
# choice (WHEP_SOURCE in bridge.env), because Daejeon's UDP media does not cross
# the VPN and KOREN boundary - the signalling answers and the screen still shows
# NO SIGNAL:
#   WHEP_SOURCE=local    /live/ goes to this host's MediaMTX, which holds the
#                        video (drones publishing here, or pulled from Daejeon
#                        over the tunnel as RTSP) and sends WebRTC one hop to the
#                        viewers. The default, and what works on the LAN.
#   WHEP_SOURCE=tunnel   /live/ goes to the Daejeon MediaMTX and the media comes
#                        straight from Daejeon. Fewer hops, but it needs the UDP
#                        to get through.
# The drone SRT feed lands on this host's own MediaMTX (:10890/udp), and
# skylens_gateway's own port (:8081) is one the drones dial directly, so neither
# passes through nginx.
#
# Daejeon blocks every inbound port but SSH (26022), so nginx cannot reach it
# directly. This host holds one SSH tunnel to Daejeon (the daejeon-tunnel service)
# and carries two forwards inside it:
#   -L 127.0.0.1:20889:127.0.0.1:10889   WHEP
#   -L 127.0.0.1:20882:127.0.0.1:8082    the proxy (permitopen on the Daejeon key
#                                        has to include 8082)
# The board socket goes through the proxy so the core's address never leaves KOREN.
#
# TLS is on for the board, not for the public internet: the browser only grants
# WebGPU to a secure context, and without one the board's renderer panics with
# "Error creating DeviceHandle: RequestAdapter" and paints nothing. So the same
# server also listens on __HTTPS_PORT__ with a certificate the installer makes,
# and a plain-HTTP request for a page is redirected there. The router forwards
# nothing to that port; it is reached over the LAN or the VPN.
#
# Both installers drop this inside http { }: /etc/nginx/sites-available/skylens on
# Linux, $(brew --prefix)/etc/nginx/servers/skylens.conf on macOS. That is why the
# map below can live here.
#
# src/demo/board.rs is the reference implementation: the demo serves the same four
# paths in-process so it needs no nginx.

# Add Connection: upgrade only for the connections that asked for an upgrade.
# Pinning it on ordinary HTTP requests makes the core's upgrader answer 400 and
# keeps intermediate hops from reusing connections. The variable is prefixed with
# skylens_ so nginx still starts if another site already declared
# $connection_upgrade (a duplicate map is a startup error).
map $http_upgrade $skylens_connection_upgrade {
    default upgrade;
    ''      close;
}

# Redirect a tower page to TLS, but only a page. A 301 on a WebSocket handshake
# breaks the socket, and a 301 on /health or /site breaks any client that is not
# a browser: the demo launcher polls /health and gives up when it gets a
# redirect. Browsers ask for text/html, programs do not, so that is the signal.
map $http_accept $skylens_wants_html {
    default      0;
    "~*text/html" 1;
}
map "$scheme:$http_upgrade:$skylens_wants_html" $skylens_tower_redirect {
    default    0;
    "http::1"  1;
}

server {
    listen __HTTP_PORT__;
    listen [::]:__HTTP_PORT__;
    listen __HTTPS_PORT__ ssl;
    listen [::]:__HTTPS_PORT__ ssl;
    server_name _;

    # The installer writes a self-signed certificate on first run and leaves an
    # existing one alone, so a trusted pair (mkcert and the like) can replace
    # these two files in place without touching this config.
    ssl_certificate     __TLS_CERT__;
    ssl_certificate_key __TLS_KEY__;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:skylens:1m;
    ssl_session_timeout 10m;

    # The only body anyone uploads is the WHEP SDP, a few KB. WebSockets are past
    # the upgrade by then and this limit does not apply to them, so /viewer carries
    # point and mesh chunks of hundreds of MB regardless.
    client_max_body_size 1m;
    server_tokens off;

    root __WEB_DIR__;
    index status.html;

    # The board is one wasm blob. Compress it; this host sits on a consumer line.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/wasm application/javascript text/javascript text/css
               image/svg+xml application/json;

    # ---- is this host alive (answers even when Daejeon does not) ----
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"ok":true,"component":"skylens_gateway"}';
    }

    # ---- is the tunnel alive (does the Daejeon MediaMTX answer) ----
    # MediaMTX answers 404 on its root, which is itself proof the tunnel carried
    # the request. check-bridge.sh treats 2xx, 3xx and 404 as alive.
    location = /healthz {
        proxy_pass http://127.0.0.1:20889/;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
        access_log off;
    }

    # ---- live video: WHEP signalling (see WHEP_SOURCE in the header) ----
    # The browser POSTs an offer to /live/<path>/whep, then sends PATCH (trickle
    # ICE) and DELETE to the session URL from the Location header. All three
    # methods land in this location.
    # The core owns the path names: SKYLENS_CORE_WHEP_BASE defaults to
    # /live/{path}/whep and {path} is drone1, drone2 or drone3, so the Daejeon
    # MediaMTX config has to define those three.
    location /live/ {
        proxy_pass http://__WHEP_UPSTREAM__/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Put the session URL back under /live/, whether MediaMTX returns the
        # Location relative (/drone1/whep/<id>) or absolute
        # (http://127.0.0.1:20889/...). Writing any proxy_redirect drops the
        # default rule, so both forms have to be spelled out or one of them leaks
        # the tunnel address to the browser.
        proxy_redirect ~^https?://[^/]+(/.*)$ /live$1;
        proxy_redirect /                      /live/;

        proxy_buffering off;          # the SDP exchange is small; buffering only adds a round trip
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;       # MediaMTX webrtcHandshakeTimeout is 10s, plus slack
    }

    # ---- board and uplink sockets (tunnel 20882 -> Daejeon proxy -> core) ----
    # Exactly these two paths, nothing else. The core's /control (the tower),
    # /site and /vworld are used inside KOREN only and stay unexposed.
    location ~ ^/(viewer|uplink)$ {
        proxy_pass http://127.0.0.1:20882;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $skylens_connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 3600s;     # a quiet stretch must not drop the socket
        proxy_send_timeout 3600s;
    }

    # ---- the board's wasm ----
    # The browser refuses the module unless the type is application/wasm
    # (instantiateStreaming: "Incorrect response MIME type"). nginx only carries
    # wasm in mime.types since 1.21.1, and Ubuntu 22.04 ships 1.18, so empty the
    # type map for this location and pin it with default_type.
    location ~ \.wasm$ {
        types { }
        default_type application/wasm;
        add_header Cache-Control "no-cache" always;

        # Compress this one at level 1, not the server default. Measured on the pi 5
        # with the 22.7 MB board: level 1 costs 0.50s of CPU per request and sends
        # 9.9 MB, level 5 costs 0.86s and sends 9.1 MB, level 9 costs 1.98s for 9.0 MB.
        # Eight percent more bytes is worth a third less CPU when the viewers arrive
        # together, and this nginx has no gzip_static to pre-compress with.
        gzip_comp_level 1;
    }

    # ---- the board's static files ----
    # A rebuild keeps the same file names, so a held copy would show yesterday's
    # board. no-cache does not mean "do not store", it means "ask every time":
    # when nothing changed the answer is a 304.
    #
    # Note: with `index status.html` and an empty WEB_DIR a request for / answers
    # 403, not 404 - nginx falls through to autoindex, which is off. A 403 here
    # means the board files are missing, not that some other server answered.
    location / {
        # Pages go to the TLS port, because WebGPU needs the secure context.
        # Only this location redirects: /health, /healthz, /viewer, /uplink and
        # /live/ answer on both schemes, so the check script and the drone side
        # are unaffected. The installer comments the line out when
        # REDIRECT_TO_HTTPS=no, which keeps plain http working for anyone who
        # instead launches Chrome with --unsafely-treat-insecure-origin-as-secure.
        __HTTPS_REDIRECT__
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }
}


# ---- the control tower, LAN and VPN only --------------------------------------
# The tower is normally an inside-KOREN screen: the core serves it on :8080 and
# the Daejeon proxy fronts it. This block makes it reachable from the operator
# LAN over the same tunnel the board uses, without putting it on the internet.
# The router forwards nothing to these ports, and the ACL the installer writes
# from TOWER_ALLOW lets only the local ranges in.
#
# It carries the whole core, not a subset: the tower page itself, its
# ws /control and ws /uplink, GET /site and the /vworld tile proxy. That is why
# it is a separate port rather than paths on the board's server - the board must
# keep exposing nothing but /viewer, /uplink and /live/.
server {
    listen __TOWER_PORT__;
    listen [::]:__TOWER_PORT__;
    listen __TOWER_TLS_PORT__ ssl;
    listen [::]:__TOWER_TLS_PORT__ ssl;
    server_name _;

    # The same certificate as the board; the tower needs WebGPU just as much.
    ssl_certificate     __TLS_CERT__;
    ssl_certificate_key __TLS_KEY__;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:skylenstower:1m;
    ssl_session_timeout 10m;

    include __TOWER_ACL__;

    client_max_body_size 1m;
    server_tokens off;

    # WHEP for the tower's camera panes, rewritten exactly as on the board.
    location /live/ {
        proxy_pass http://__WHEP_UPSTREAM__/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect ~^https?://[^/]+(/.*)$ /live$1;
        proxy_redirect /                      /live/;
        proxy_buffering off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
    }

    location / {
        __TOWER_REDIRECT__
        proxy_pass http://127.0.0.1:20882;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $skylens_connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
