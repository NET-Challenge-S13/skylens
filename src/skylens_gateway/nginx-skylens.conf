# 브리지 nginx: KOREN 외부망 진입
# (setup-bridge.sh · setup-bridge-macos.sh 가 __HTTP_PORT__ · __WEB_DIR__ 를 치환한다)
#
# 이 서버(175.126.98.44)에 올라가는 것과 경로:
#   /            → __WEB_DIR__ 정적 파일   현황판 wasm 빌드 (프록시 없음, 서버 프로세스 없음)
#   /viewer      → 127.0.0.1:20882 → 대전 프록시 :8082 → 코어 /viewer   현황판 WebSocket
#   /uplink      → 127.0.0.1:20882 → 대전 프록시 :8082 → 코어 /uplink   업링크 WebSocket
#   /live/       → 127.0.0.1:20889 → 대전 MediaMTX :10889               WHEP 시그널링
#   /healthz     → 127.0.0.1:20889                                      터널 생존 확인
#   /health      → nginx 자신                                           이 서버 생존 확인
#
# 이 파일이 중개하는 것은 **시그널링과 제어**뿐이다. 영상 미디어는 대전 10189/udp 에서
# 브라우저로 직결되고(WebRTC), 드론 SRT 는 같은 호스트의 MediaMTX :10890/udp 가 받는다.
# skylens_gateway 포트(:8081)도 드론이 직접 붙으므로 nginx 를 거치지 않는다.
#
# 대전 쪽 포트는 KOREN 이 SSH(26022) 외 인바운드를 막아 직접 못 붙는다. 이 서버가 대전으로
# SSH 터널 하나(daejeon-tunnel 서비스)를 걸고, 그 안에 두 포워드를 싣는다.
#   -L 127.0.0.1:20889:127.0.0.1:10889   WHEP
#   -L 127.0.0.1:20882:127.0.0.1:8082    프록시 (대전 브리지 키 permitopen 에 8082 포함)
# 현황판 WebSocket 이 프록시를 거치는 것은 코어 주소를 밖에 노출하지 않기 위해서다.
#
# 설치 위치는 둘 다 http { } 안이다 — Ubuntu /etc/nginx/sites-available/skylens,
# macOS $(brew --prefix)/etc/nginx/servers/skylens.conf. 그래서 map 을 여기 둘 수 있다.
# 같은 동작의 참조 구현은 src/demo/board.rs (데모는 nginx 없이 같은 네 경로를 흉내낸다).

# WebSocket 업그레이드를 요청한 연결에만 Connection: upgrade 를 붙인다.
# 평범한 HTTP 요청까지 upgrade 를 달면 코어의 업그레이더가 400 으로 끊고, 중간 홉이
# 연결을 재사용하지 못한다. 변수 이름에 skylens_ 를 붙인 것은 다른 사이트 설정이
# $connection_upgrade 를 이미 선언했을 때 "duplicate" 로 nginx 가 안 뜨기 때문이다.
map $http_upgrade $skylens_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen __HTTP_PORT__;
    listen [::]:__HTTP_PORT__;
    server_name _;

    # 올려받는 것은 WHEP 의 SDP(수 KB)뿐이다. WebSocket 은 업그레이드 뒤라 이 제한을
    # 받지 않으므로, 점군·메시 청크가 수백 MB 여도 /viewer 는 영향이 없다.
    client_max_body_size 1m;
    server_tokens off;

    root __WEB_DIR__;
    index status.html;

    # 현황판은 wasm 한 덩어리다. 압축해서 내보낸다(브리지 회선은 상용이다).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/wasm application/javascript text/javascript text/css
               image/svg+xml application/json;

    # ---- 이 서버 자신의 생존 (대전과 무관하게 답한다) ----
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"ok":true,"component":"skylens_gateway"}';
    }

    # ---- 터널 생존 확인 (대전 MediaMTX 가 답하는지) ----
    location = /healthz {
        proxy_pass http://127.0.0.1:20889/;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
        access_log off;
    }

    # ---- 라이브 영상: WHEP 시그널링 (대전 MediaMTX, 터널 20889) ----
    # 브라우저는 POST /live/<path>/whep 으로 SDP 를 보내고, 응답의 Location(세션 URL)으로
    # PATCH(trickle ICE)·DELETE(종료)를 보낸다. 세 메서드가 모두 이 location 을 탄다.
    # 경로 이름은 코어가 정한다 — SKYLENS_CORE_WHEP_BASE 기본값이 /live/{path}/whep 이고
    # {path} 는 drone1·drone2·drone3 이다. 대전 MediaMTX 에 그 세 경로가 있어야 한다.
    location /live/ {
        proxy_pass http://127.0.0.1:20889/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 세션 URL 되돌리기. MediaMTX 가 Location 을 상대경로(/drone1/whep/<id>)로 주든
        # 절대 URL(http://127.0.0.1:20889/...)로 주든 둘 다 /live/ 아래로 돌린다.
        # proxy_redirect 를 하나라도 쓰면 기본 규칙이 사라지므로 두 경우를 다 적는다.
        proxy_redirect ~^https?://[^/]+(/.*)$ /live$1;
        proxy_redirect /                      /live/;

        proxy_buffering off;          # SDP 교환은 짧다. 버퍼링은 왕복만 늘린다
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;       # MediaMTX webrtcHandshakeTimeout 10s + 여유
    }

    # ---- 현황판·업링크 WebSocket (터널 20882 → 대전 프록시 :8082 → 코어) ----
    # 정확히 이 두 경로만 연다. 코어의 /control(관제탑)·/site·/vworld 는 KOREN 안에서만
    # 쓰이므로 밖으로 내보내지 않는다.
    location ~ ^/(viewer|uplink)$ {
        proxy_pass http://127.0.0.1:20882;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $skylens_connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 3600s;     # 조용한 구간에도 끊기지 않게
        proxy_send_timeout 3600s;
    }

    # ---- 현황판 wasm ----
    # MIME 이 application/wasm 이 아니면 브라우저가 모듈을 거부한다
    # (instantiateStreaming: "Incorrect response MIME type"). nginx 의 mime.types 에
    # wasm 이 들어간 것은 1.21.1 부터다 — Ubuntu 22.04 는 1.18 이라 없다.
    # types { } 로 이 location 의 매핑을 비우고 default_type 으로 못박는다.
    location ~ \.wasm$ {
        types { }
        default_type application/wasm;
        add_header Cache-Control "no-cache" always;
    }

    # ---- 현황판 정적 파일 ----
    # 빌드를 덮어쓰면 파일 이름이 그대로이므로 캐시를 들고 있으면 옛 화면이 뜬다.
    # no-cache 는 "쓰지 말라"가 아니라 "쓸 때마다 물어보라"다. 안 바뀌면 304 로 끝난다.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }
}
