# MediaMTX on the bridge (175.126.98.44).
#
# Role: hold the SRT feed coming from the field gateway. Daejeon reaches out
# and pulls it from here, because the gateway rides 5G with a changing address
# and cannot enter KOREN itself.
# This host does not distribute video; Daejeon does the WebRTC fan-out.
#
# setup-bridge.sh substitutes __PUBLISH_PASS__ and __SRT_PORT__ from bridge.env.

logLevel: info
logDestinations: [stdout]

api: no
metrics: no
pprof: no
playback: no
rtsp: no
rtmp: no
hls: no
webrtc: no
moq: no

# ---- SRT (ingest) ----
srt: yes
srtAddress: :__SRT_PORT__

# ---- authentication ----
# The gateway publishes with a password; only Daejeon may read.
# The core owns the path names (SKYLENS_CORE_STREAM_PATH, default `drone{id}`).
# The formation is left, center, right, so drone1, drone2, drone3. Add a path
# here whenever the formation grows.
authMethod: internal
authInternalUsers:
  - user: drone
    pass: __PUBLISH_PASS__
    ips: []
    permissions:
      - action: publish
        path: drone1
      - action: publish
        path: drone2
      - action: publish
        path: drone3
  - user: any
    pass:
    ips: ['127.0.0.1/32', '116.89.187.181/32']   # local checks + Daejeon
    permissions:
      - action: read
        path: drone1
      - action: read
        path: drone2
      - action: read
        path: drone3

pathDefaults:
  source: publisher

paths:
  drone1:
  drone2:
  drone3:
