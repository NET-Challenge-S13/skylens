[package]
build = "build.rs"
name = "skylens-client"
description = "Status board (현황판): the legacy board's HTML/CSS on Blitz with a pointblitz reconstruction view, web and native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"
crate-type = ["rlib", "cdylib"]

# Native window: `skylens-client --core ws://host:8080/viewer`.
# On wasm32 this target compiles to an empty main; build the web bundle with build-web.sh.
[[bin]]
name = "skylens-client"
path = "main.rs"

[dependencies]
skylens-shared.workspace = true
skylens-viewer.workspace = true
prost.workspace = true
anyhow.workspace = true
# Glyph lookup for the minimap's scale label (the same version vello and parley use).
skrifa = "0.44"

# The minimap is a Blitz custom widget, so the board needs the Widget trait itself.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
blitz-dom = { workspace = true, features = ["custom-widget"] }

# Web: the same Blitz revision without the desktop-only features, as in skylens-viewer.
[target.'cfg(target_arch = "wasm32")'.dependencies]
blitz-dom = { git = "https://github.com/DioxusLabs/blitz", rev = "45496d9288b063719ebeae4e0761273f7881b3d7", default-features = false, features = ["woff", "custom-widget"] }
wasm-bindgen = "0.2"

[build-dependencies]
# Embeds res/icon/skylens.ico into the Windows executable.
winresource = "0.1"
