<!doctype html>
<html lang="ko"><head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyLens · 현황판 - 실시간 3D 복원</title>
    <link rel="stylesheet" href="../../shared/viewer/ui/fonts.css" />
    <link rel="stylesheet" href="../../shared/viewer/ui/style.css" />
    <link rel="stylesheet" href="status-panels.css" />
  </head>
<body>
    <section class="pane pane--status pane--full">
      <canvas id="status-view"></canvas>
      <div id="overlay-status" class="overlay"><div class="detect-card"><div class="detect-card__kicker"></div><div class="detect-card__label"></div><div class="detect-card__conf"></div><div class="detect-card__bar"><span></span></div><button class="detect-card__btn" type="button">탐지 확인</button></div><div class="cam-state">CAM · SYNCED</div><div class="splat-loading is-visible" id="board-waiting">코어 연결됨 · 첫 구간 복원 대기 중</div></div>
      <div id="net-status" class="net-badge"><span class="net-badge__dot" style="background: rgb(57, 217, 138);"></span><span>코어 연결됨 · 데이터 대기</span></div>
      <div id="server-status" class="sl-surface sl-surface--panel server-status"><span class="server-status__dot" data-state="connected"></span><div class="server-status__body"><span class="server-status__text">서버 · 연결됨</span><span class="server-status__detail">청크 0 · 탐지 0 · 0ms</span><span class="server-status__detail">코어 연결됨 · 데이터 대기</span></div><div class="server-status__ladder"></div></div>
      <div id="live-wait" class="live-wait"><div class="live-wait__cap"><div class="live-wait__big">3D 공간 생성 중</div><div id="live-wait-sub" class="live-wait__sub">경과 0:00</div></div></div>
      <div id="live-monitor" class="sl-surface sl-surface--frame live-monitor"><canvas id="live-monitor-canvas" class="live-monitor__canvas" width="220" height="140"></canvas><div class="live-monitor__shade"></div><div id="live-monitor-label" class="live-monitor__label"></div><div id="live-monitor-sub" class="live-monitor__sub"></div><div id="live-monitor-age" class="live-monitor__age"></div></div>
      <div id="live-panel" class="sl-surface sl-surface--panel live-panel">
        <div class="live-head"><span class="live-head__title">실시간 복원</span><span id="live-indicator" class="live-indicator is-on"><i class="live-indicator__dot"></i>LIVE</span><button type="button" id="live-go-live" class="live-btn live-btn--accent" data-act="live">LIVE</button></div>
        <div class="live-row"><button type="button" class="live-btn" data-act="prev" title="한 단계 뒤로">이전</button><button type="button" id="live-play" class="live-btn" data-act="play" title="재생 / 일시정지">일시정지</button><button type="button" class="live-btn" data-act="next" title="한 단계 앞으로">다음</button><span class="live-lbl">속도</span><span class="live-seg"><button type="button" class="live-btn live-seg__btn" data-speed="1">1x</button><button type="button" class="live-btn live-seg__btn" data-speed="5">5x</button><button type="button" class="live-btn live-seg__btn is-on" data-speed="20">20x</button><button type="button" class="live-btn live-seg__btn" data-speed="60">60x</button></span></div>
        <div class="live-row"><span class="live-lbl">점 크기</span><button type="button" class="live-btn live-btn--sq" data-act="size-down" title="작게">-</button><span id="live-size-val" class="live-val">2.0</span><button type="button" class="live-btn live-btn--sq" data-act="size-up" title="크게">+</button><span class="live-lbl">색</span><span class="live-seg"><button type="button" class="live-btn live-seg__btn is-on" data-mode="rgb">RGB</button><button type="button" class="live-btn live-seg__btn" data-mode="zone">구역</button><button type="button" class="live-btn live-seg__btn" data-mode="height">고도</button></span><button type="button" class="live-btn" data-act="fit">화면 맞춤</button></div>
        <div class="live-stats"><div class="live-kv"><span class="live-lbl">경과 T+</span><b id="live-t">0:00</b></div><div class="live-kv"><span class="live-lbl">PTS</span><b id="live-pts">0</b></div><div class="live-kv"><span class="live-lbl">EVT</span><b id="live-evt">0/0</b></div></div>
        <div class="live-progress"><div class="live-progress__row"><span id="live-bar-label" class="live-lbl">EVENTS 0/0</span><span id="live-bar-pct" class="live-lbl">0%</span></div><div class="live-bar"><i id="live-bar-fill"></i></div></div>
        <div class="live-cnt"><span class="live-cnt__moved">MOVED<b id="live-cnt-moved">0</b></span><span class="live-cnt__new">NEW<b id="live-cnt-new">0</b></span><span class="live-cnt__gone">GONE<b id="live-cnt-gone">0</b></span></div>
        <div id="live-evhead" class="live-evhead" data-act="events">EVENTS</div>
        <div id="live-events" class="live-events"></div>
      </div>
      <div id="minimap" class="sl-surface sl-surface--frame"><canvas class="minimap__canvas" width="198" height="198" style="width: 198px; height: 198px;"></canvas></div>
    <div class="sl-surface sl-surface--chip pane-label pane-label--status"><span class="sl-dot"></span><span class="sl-surface__label">현황판 · 실시간 3D 복원</span></div><button type="button" id="point-toggle" class="point-toggle is-on" aria-pressed="true"><span class="point-toggle__label">점 · 고도색</span><span class="point-toggle__meta">수신 대기</span></button></section>
    <div id="toast-root"></div>
  

</body></html>
