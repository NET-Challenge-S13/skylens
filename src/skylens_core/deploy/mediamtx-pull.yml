# MediaMTX on the Daejeon VM, stage 2: pull from the bridge.
#
# Same as mediamtx.yml except where the drone paths get their source:
#   stage 1, mediamtx.yml      : publisher (a local ffmpeg test source pushes in)
#   stage 2, mediamtx-pull.yml : Daejeon pulls the bridge SRT (outbound from here)
#
# The gateway rides 5G and cannot enter KOREN, so the bridge holds the feed and
# Daejeon fetches it. The bridge MediaMTX allows a password-less read from
# 116.89.187.181.

logLevel: info
logDestinations: [stdout]

api: no
metrics: no
pprof: no
playback: no
rtsp: no
rtmp: no
hls: no
moq: no

srt: yes
srtAddress: :10890

webrtc: yes
webrtcAddress: :10889
webrtcEncryption: no
webrtcAllowOrigins: ['*']
webrtcTrustedProxies: [127.0.0.1]
webrtcLocalUDPAddress: :10189
webrtcLocalTCPAddress: ''
webrtcIPsFromInterfaces: yes
webrtcIPsFromInterfacesList: [ens3]
webrtcAdditionalHosts: []
webrtcICEServers2: []
webrtcHandshakeTimeout: 10s
webrtcTrackGatherTimeout: 2s

pathDefaults:
  sourceOnDemand: no

# Pull all three paths from the bridge. The names are the core's drone1, drone2
# and drone3 (SKYLENS_CORE_STREAM_PATH = `drone{id}`). The streamid carries no
# account because the bridge lets this address read without a password.
paths:
  drone1:
    source: srt://175.126.98.44:10890?streamid=read:drone1
    sourceOnDemand: no
  drone2:
    source: srt://175.126.98.44:10890?streamid=read:drone2
    sourceOnDemand: no
  drone3:
    source: srt://175.126.98.44:10890?streamid=read:drone3
    sourceOnDemand: no
