[package]
name = "skylens-drone"
description = "Drone mission bridge: GPS route to DJI Fly KMZ"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "skylens-drone"
path = "main.rs"

[dependencies]
skylens-shared.workspace = true
prost.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
axum.workspace = true

# KMZ read/write. Only deflate: DJI Fly KMZs are plain deflated zips.
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }
regex = "1"
chrono = "0.4"
percent-encoding = "2"

# DJI request signing and the manual AWS SigV4 upload
hmac = "0.12"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# core uplink (ws:// only; the core sits behind a plain-WebSocket proxy)
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }

[dev-dependencies]
tempfile = "3"
