# skylens_proxy: KOREN internal multi-path into skylens_core (Daejeon, :8082)
#
# Every connection that enters KOREN (drone uplink from the gateway, board/viewer sockets)
# lands here and is passed to the first healthy core path. Path #0 is preferred; the
# backup path takes over when #0 refuses, times out or answers 502/503, and nginx tries
# #0 again once fail_timeout has passed (failback).
#
# Open-source nginx only checks passively: a path is marked down when a real request fails.
# Long-lived WebSockets do not move on failover; the client reconnects and lands on the
# surviving path.

upstream skylens_core {
    server 127.0.0.1:8080 max_fails=1 fail_timeout=3s;   # core path #0 (preferred)
    server 127.0.0.1:8180 backup;                        # core path #1 (standby)
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 8082;
    listen [::]:8082;
    server_name _;

    client_max_body_size 64m;   # video segments and frame sets

    # Proxy liveness only. Core health is GET /core/health below.
    location = /health {
        default_type application/json;
        return 200 '{"ok":true,"component":"skylens_proxy"}';
    }

    location /core/ {
        proxy_pass http://skylens_core/;
        include /etc/nginx/snippets/skylens-proxy-headers.conf;
    }

    location / {
        proxy_pass http://skylens_core;
        include /etc/nginx/snippets/skylens-proxy-headers.conf;
    }
}
