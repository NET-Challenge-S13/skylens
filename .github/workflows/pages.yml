name: Deploy guidebook to GitHub Pages

on:
  push:
    branches: [develop]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Allow the workflow to publish to Pages. No repo write access is needed.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A queued run is superseded rather than cancelled
# mid-flight, so a push during a deploy does not leave the site half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The guidebook is plain HTML/CSS/JS, so site/ is uploaded as-is. There
      # is no build step to break and nothing to install.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
