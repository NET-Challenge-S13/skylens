# cumulus3d reconstruction plan (aerial-formation preset, same as the `cumulus3d stream` defaults).
# Run: cumulus3d run examples/plans/aerial-formation.toml
# Relative paths are relative to the working location. Missing items take defaults, unknown items are an error.

seed = 7                         # RANSAC seed (if removed, differs from run to run)
threads = 0                      # 0 = number of cores
gps = "data/gps_ref.txt"         # `name latitude longitude altitude` lines
pairing = "formation"            # formation pairing rule

[input]
images = "data/images"           # <images>/<camera>/<camera>_NNNN.jpg
cameras = ["camF", "camR", "camL"]
stride = 3                       # only file number % stride == 0
# only the first N positions

[zones]
span = 12
overlap = 2

[align]
frame = "enu"                    # enu | none
fixed_origin = false

[features]
backend = "cpu"                  # cpu | cuda
max_num_features = 8192
max_image_size = 3200

[matching]
backend = "cpu"                  # cpu | cuda

[sparse]
incremental_triangulation = false

[dense]
enabled = true                   # false = skip densification
backend = "cuda"
profile = "fast"                 # fast | quality
max_image_size = 960
views = 10
serialize = false
depth_cache = false

[dense.fusion]                   # profile defaults if left empty
# mode = "consistency"           # consistency | traversal
# min_views = 3
# depth_error = 0.01
# normal_error = 10.0
# reproj_error = 2.0
# residual = "none"              # none | release | second-pass

[dense.filter]
# min_views = 2
# geom_error = 1.0
# min_ncc = 0.1
# median = false

[sinks]
out = "out"
clean = true                     # delete and recreate the output folder at start
echo = true
timeline = true
run_log = true
zone_ply = true
snapshots = true
models = false
