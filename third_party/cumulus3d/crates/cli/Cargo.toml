[package]
name = "cumulus3d-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "cumulus3d command-line tool: progressive drone-image 3D reconstruction in one process"
repository.workspace = true
keywords = ["sfm","photogrammetry","drone","point-cloud","cli"]
categories = ["computer-vision","command-line-utilities"]
readme = "README.md"

[[bin]]
name = "cumulus3d"
path = "src/main.rs"

[dependencies]
cumulus3d-core.workspace = true
cumulus3d-features.workspace = true
cumulus3d-matching.workspace = true
cumulus3d-ba.workspace = true
cumulus3d-sfm.workspace = true
cumulus3d-align.workspace = true
cumulus3d-dense.workspace = true
cumulus3d-cuda.workspace = true
clap.workspace = true
rayon.workspace = true
nalgebra.workspace = true
image.workspace = true
serde.workspace = true
toml.workspace = true

[lib]
name = "cumulus3d_cli"
path = "src/lib.rs"
