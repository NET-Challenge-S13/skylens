name: Release

# Push a tag `vX.Y.Z` (matching the workspace version) to run every CI check, build the `cumulus3d` binaries,
# create a GitHub Release with them, and publish the crates to crates.io.
# crates.io publishing runs only when the `CARGO_REGISTRY_TOKEN` secret is set; otherwise it is skipped.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches workspace version
        run: |
          v=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then echo "tag $GITHUB_REF_NAME does not match workspace version $v"; exit 1; fi

  binaries:
    needs: [ci, version]
    name: binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked -p cumulus3d-cli --bin cumulus3d
      - name: Archive
        run: |
          name="cumulus3d-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp target/release/cumulus3d LICENSE NOTICE THIRD_PARTY_NOTICES.md README.md CHANGELOG.md "$name"/
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: cumulus3d-*.tar.gz*

  github-release:
    needs: binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "cumulus3d $GITHUB_REF_NAME" --generate-notes --verify-tag

  crates-io:
    needs: [ci, version]
    runs-on: ubuntu-24.04
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: Token present
        id: token
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::notice::CARGO_REGISTRY_TOKEN is not set; crates.io publishing skipped"
            echo "set=false" >> "$GITHUB_OUTPUT"
          else
            echo "set=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.token.outputs.set == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: steps.token.outputs.set == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.token.outputs.set == 'true'
      - uses: taiki-e/install-action@v2
        if: steps.token.outputs.set == 'true'
        with:
          tool: cargo-semver-checks
      - name: Public API compatibility with the last published version
        if: steps.token.outputs.set == 'true'
        run: |
          if curl -sf -A "cumulus3d-release (github actions)" https://crates.io/api/v1/crates/cumulus3d-core > /dev/null; then
            cargo semver-checks --workspace
          else
            echo "::notice::not published yet; no baseline for semver checks"
          fi
      - name: Publish
        if: steps.token.outputs.set == 'true'
        run: cargo publish --workspace --locked
